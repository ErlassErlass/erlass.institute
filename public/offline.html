<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koneksi Terputus - Erlass Ekskul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-body: #f1f5f9;
            --text-color: #334155;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.04) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.04) 0px, transparent 50%);
        }
        .offline-container {
            max-width: 450px;
            padding: 2.5rem;
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            margin: 1rem;
        }
        .icon {
            font-size: 4rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 0.75rem;
            color: #1e293b;
        }
        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #64748b;
            margin-bottom: 2rem;
        }
        .btn-retry {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.75rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .btn-retry:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon">⚡</div>
        <h1>Koneksi Internet Terputus</h1>
        <p>Halaman yang Anda tuju belum tersimpan dalam cache lokal atau koneksi internet Anda sedang bermasalah. Pastikan perangkat Anda terhubung ke jaringan internet dan coba kembali.</p>
        <button class="btn-retry" onclick="window.location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
