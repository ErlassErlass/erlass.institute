<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koneksi Terputus — Erlass Ekskul</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">

    <style>
        :root {
            --imp-navy: #0F172A;
            --imp-blue: #3B82F6;
            --imp-blue-dark: #1E40AF;
            --imp-slate: #64748B;
            --imp-surface: #FFFFFF;
            --imp-border: #E2E8F0;
            --imp-radius: 20px;
            --imp-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #F8FAFC;
            color: var(--imp-navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }

        .offline-card {
            background: var(--imp-surface);
            border: 1px solid var(--imp-border);
            border-radius: var(--imp-radius);
            box-shadow: var(--imp-shadow);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            text-align: center;
        }

        .offline-hero {
            background: linear-gradient(135deg, var(--imp-navy) 0%, #1E3A5F 50%, var(--imp-blue-dark) 100%);
            padding: 2.5rem 1.5rem;
            color: white;
            position: relative;
        }

        .offline-hero::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3), transparent 70%);
            pointer-events: none;
        }

        .offline-icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 2.5rem;
            color: #FBBF24;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(251, 191, 36, 0); }
        }

        .offline-hero h2 {
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
            color: #FFFFFF;
        }

        .offline-hero p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            margin: 0;
        }

        .offline-body {
            padding: 2rem 1.5rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            margin-bottom: 1.25rem;
        }

        .status-badge.online {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
        }

        .btn-reconnect {
            background: linear-gradient(135deg, var(--imp-blue) 0%, var(--imp-blue-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.85rem 2rem;
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
            transition: all 0.3s ease;
        }

        .btn-reconnect:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.45);
            color: white;
        }
    </style>
</head>
<body>

    <div class="offline-card">
        <div class="offline-hero">
            <div class="offline-icon-circle">
                <i class="bi bi-wifi-off"></i>
            </div>
            <h2>Koneksi Internet Terputus</h2>
            <p>Erlass Ekskul — Mode Luar Jaringan (Offline)</p>
        </div>

        <div class="offline-body">
            <div class="status-badge" id="statusBadge">
                <i class="bi bi-exclamation-circle-fill"></i> Sinyal Terputus
            </div>

            <p class="small text-secondary mb-4">
                Halaman ini tidak dapat dimuat karena perangkat Anda kehilangan koneksi internet. Pastikan WiFi atau Data Seluler aktif.
            </p>

            <button type="button" class="btn-reconnect mb-3" id="btnReload">
                <i class="bi bi-arrow-clockwise me-2"></i> Coba Hubungkan Ulang
            </button>

            <div class="small text-muted" style="font-size: 0.78rem;">
                <i class="bi bi-info-circle me-1"></i> Aplikasi akan otomatis memuat ulang saat koneksi kembali stabil.
            </div>
        </div>
    </div>

    <script>
        const statusBadge = document.getElementById('statusBadge');
        const btnReload = document.getElementById('btnReload');

        function updateOnlineStatus() {
            if (navigator.onLine) {
                statusBadge.className = 'status-badge online';
                statusBadge.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Terhubung Kembali! Memuat...';
                setTimeout(() => window.location.reload(), 1000);
            } else {
                statusBadge.className = 'status-badge';
                statusBadge.innerHTML = '<i class="bi bi-exclamation-circle-fill me-1"></i> Sinyal Terputus';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        btnReload.addEventListener('click', () => {
            btnReload.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memeriksa Sinyal...';
            btnReload.disabled = true;
            setTimeout(() => {
                if (!navigator.onLine) {
                    btnReload.disabled = false;
                    btnReload.innerHTML = '<i class="bi bi-arrow-clockwise me-2"></i> Coba Hubungkan Ulang';
                    alert('Internet masih terputus. Mohon periksa jaringan Anda.');
                } else {
                    window.location.reload();
                }
            }, 1200);
        });
    </script>
</body>
</html>
